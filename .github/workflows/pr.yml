name: PR

on:
  pull_request: { }
  # Also on every push to main: a PR can be merged before its checks finish (#180 and #182
  # were), so main itself is tested after each merge.
  push:
    branches: [ main ]

# Least privilege: every job below only checks out the repo and runs local
# tooling (lint, tests, govulncheck, frontend build, a non-pushing Docker
# build). None of them call back to the GitHub API to write checks, comments,
# packages, or refs, so a single read-only default covers them all. If a job
# ever needs more (e.g. golangci-lint-action's `only-new-issues` mode reading
# the PR diff, or a job that pushes), grant that scope on the job itself
# rather than raising this default.
permissions:
  contents: read

jobs:
  lint:
    name: Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run go generate
        run: go generate ./...

      - name: Golangci Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1

  vuln_check:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run Govulncheck
        run: govulncheck -C . -format text ./...

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run go generate
        run: go generate ./...

      # go generate rewrites the committed schema in this checkout, so the freshness test
      # cannot see a stale file. A diff here is the stale file: run go generate and commit.
      - name: Scenario schema is up to date
        run: git diff --exit-code -- testdata/scenarios/schema.v1.json || { echo "::error::testdata/scenarios/schema.v1.json is stale; run 'go generate ./...' and commit it"; exit 1; }

      - name: Run go test
        run: go test ./...

  # The real-binary end-to-end tests of the Sandbox Lab (supervisor, MCP, clock, faults,
  # accounts: the tests gated by KQ_SANDBOX_E2E_BIN) and the race detector over the lab, the
  # gateway and the supervisor. Plain `go test ./...` in "Tests" skips the first and never
  # runs the second, so the lock's end-to-end proofs and every race claim were local only.
  # Serial (-p 1): each package starts gateways of its own.
  #
  # Budget: measured locally (Apple M-series, 10 cores) at 339 s with a warm build cache and
  # 507 s cold, of which the test binaries are about 310 s (the gateway package alone 142 s,
  # the supervisor and sandboxlab ~50 s each). A 4-vCPU runner compiles with -race perhaps 2-3x
  # slower and runs the serial tests ~1.5x slower, plus a cold `make build`: an expected
  # 20-25 min, so 40 min of job time. `-timeout 20m` is per test binary (the slowest is under
  # 2.5 min here); a hung package then fails with a goroutine dump instead of eating the job.
  #
  # No KQ_SANDBOX_MIN_FREE_MB: the supervisor's floor is 1 GiB of MemAvailable on Linux and
  # a hosted runner has 7 GiB or more, so it is never refused. Not inside `unshare --net`
  # (unlike "Scenarios"): that job runs scenario files through the binary, whose second layer
  # of defense is the empty namespace. These are the repo's own Go tests, the same kind as
  # "Tests" (which has network) and must not dial out by repo rule, the binary's egress guard
  # is itself under test here, and `go test -race` inside root's namespace would need the
  # toolchain, module cache and build cache handed across `sudo`.
  sandbox-e2e:
    name: Sandbox E2E and race
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # `make build` runs go generate and writes build/khunquant, the binary the E2E tests start.
      - name: Build once
        run: make build

      - name: End-to-end on the real binary, with the race detector
        env:
          KQ_SANDBOX_E2E_BIN: ${{ github.workspace }}/build/khunquant
        run: go test -p 1 -race -timeout 20m ./pkg/sandbox/... ./cmd/khunquant/internal/sandboxlab/... ./cmd/khunquant/internal/gateway/...

  # Lab scenarios: every active scripted file under testdata/scenarios, run serially from
  # one prebuilt binary and without network. Not part of "Tests" (a lab run needs a built
  # binary, a wall-time budget and a network namespace, none of which belong inside
  # `go test`), so a failure here names the scenario run, not a Go test. It gates merges only
  # once a maintainer makes it a required check in branch protection.
  scenarios:
    name: Scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The only build: `make build` runs go generate and writes build/khunquant. The
      # runner starts every instance from this binary and never compiles.
      - name: Build once
        run: make build

      - name: Validate every scenario
        run: ./build/khunquant sandbox run --validate-only testdata/scenarios

      # Two layers keep a scenario off the network: the egress guard in the binary, and an
      # empty network namespace here (only loopback, which the instances talk over). The
      # namespace needs root; the run itself goes back to the runner user.
      - name: Run active scenarios without network
        run: |
          sudo -E unshare --net -- sh -c 'ip link set lo up && exec sudo -E -u "$1" ./build/khunquant sandbox run --timeout 5m --report scenarios-report.md testdata/scenarios' sh "$(id -un)"
          # A run that never started writes no report: that is not a pass.
          test -s scenarios-report.md || { echo "::error::no scenario report: the run did not start"; exit 1; }

      # The report says which expectation failed, with the journal around it. Without this
      # step a red run could not be read after the log scrolled away.
      - name: Scenario report
        if: always()
        run: |
          if [ -f scenarios-report.md ]; then cat scenarios-report.md >> "$GITHUB_STEP_SUMMARY"; fi

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Pinned to the major that produced the lockfile (v9 format, pnpm 10.x)
      # rather than @latest. This job exists to catch lockfile problems, so a
      # floating package manager that might reject or silently rewrite the
      # lockfile would undermine the check.
      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10 --activate

      # --frozen-lockfile is the point: it fails when the lockfile disagrees
      # with package.json. A Dependabot PR that regenerated the lockfile without
      # the pnpm.overrides block passed every existing check while making clean
      # installs impossible and silently dropping two security pins.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # "pnpm build" is "tsc -b && vite build" — the same command that produces
      # the dashboard embedded in the Go binary.
      - name: Typecheck and build
        run: pnpm build

      # The build regenerates routeTree.gen.ts. Generation is deterministic, so
      # a diff here means the committed file is stale — which is how a
      # router-plugin bump silently left it 151 lines out of date.
      - name: Check generated route tree is current
        run: git diff --exit-code -- src/routeTree.gen.ts

      # Runs last: it is the least severe failure, and a broken build or a
      # stale generated file should surface first. This also covers the class
      # of break where a TypeScript upgrade outruns typescript-eslint.
      - name: Lint
        run: pnpm lint

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Builds only; nothing is pushed. docker-build.yml publishes images and
      # runs on workflow_call at release time, so before this job no PR ever
      # built an image. That is how a go.mod directive bump to a version newer
      # than the builder image reached main with three green checks: CI resolves
      # its toolchain from go.mod, so only an image build sees the mismatch.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

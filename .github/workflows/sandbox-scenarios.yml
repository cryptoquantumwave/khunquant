name: Sandbox Scenarios

# The known-bug set of the Sandbox Lab, run daily and on demand. A known_bug scenario
# documents a defect that is still open and stays red until the change that fixes it flips
# it to active, so a red known_bug scenario here is expected. This workflow fails when an
# ACTIVE scenario fails (a regression of main that the PR job did not catch), and reports
# which known bugs now pass (a fix forgot to flip its status) as warnings. The PR job
# "Scenarios" in pr.yml runs the active set on every PR; it gates merges once it is a
# required check.
#
# Kept apart from nightly.yml: that workflow's release job holds contents: write,
# packages: write and the registry secrets. This one reads the repository and nothing else.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: { }

permissions:
  contents: read

jobs:
  known-bugs:
    name: Known-bug scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build once
        run: make build

      - name: Validate every scenario
        run: ./build/khunquant sandbox run --validate-only testdata/scenarios

      # The namespace on its own first: below, exit 1 is read as "an active scenario failed",
      # and a failing sudo or unshare also exits 1, which would be mistaken for one.
      - name: Check the network namespace
        run: sudo unshare --net -- true

      # Same namespace as the PR job. The classification is in the runner, not here:
      # --known-bugs-may-fail makes a known_bug scenario whose expectation failed (an open
      # defect) not count, while an ACTIVE scenario that failed is a regression and exits 1,
      # and an invalid scenario (2) or an infrastructure failure (3) exits as it always does.
      # A known_bug scenario that now passes means a fix landed without flipping the status
      # to active: the run prints a "warning" line for it, shown here as an annotation; it
      # does not fail the job. The report (heading "# Scenario <id> [known_bug <ID>]: <verdict>"
      # for a known bug) goes to the job summary.
      - name: Run all scenarios, known bugs included, without network
        env:
          KQ_SCENARIO_KNOWN_BUGS: "1"
        run: |
          code=0
          sudo -E unshare --net -- sh -c 'ip link set lo up && exec sudo -E -u "$1" ./build/khunquant sandbox run --known-bugs-may-fail --timeout 5m --report scenarios-report.md testdata/scenarios' sh "$(id -un)" > scenarios-stdout.txt || code=$?
          cat scenarios-stdout.txt
          if [ ! -s scenarios-report.md ]; then
            echo "::error::no scenario report (exit $code): the run did not start"
            exit 1
          fi
          cat scenarios-report.md >> "$GITHUB_STEP_SUMMARY"
          sed -n 's/^warning  /::warning::/p' scenarios-stdout.txt
          if [ "$code" -ne 0 ]; then
            echo "::error::exit $code: an active scenario failed (a regression), or a scenario was invalid or could not run"
            exit "$code"
          fi

services:
  # ─────────────────────────────────────────────
  # KhunQuant Agent (one-shot query)
  #   docker compose -f docker/docker-compose.yml run --rm khunquant-agent -m "Hello"
  # ─────────────────────────────────────────────
  khunquant-agent:
    image: docker.io/cryptoquantumwave/khunquant:latest
    container_name: khunquant-agent
    profiles:
      - agent
    # Uncomment to access host network; leave commented unless needed.
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/root/.khunquant
    entrypoint: ["khunquant", "agent"]
    stdin_open: true
    tty: true

  # ─────────────────────────────────────────────
  # KhunQuant Gateway (Long-running Bot)
  #   docker compose -f docker/docker-compose.yml --profile gateway up
  # ─────────────────────────────────────────────
  khunquant-gateway:
    image: docker.io/cryptoquantumwave/khunquant:latest
    container_name: khunquant-gateway
    restart: on-failure
    profiles:
      - gateway
    # Uncomment to access host network; leave commented unless needed.
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/root/.khunquant

  # ─────────────────────────────────────────────
  # KhunQuant Launcher (Web Console + Gateway)
  #   docker compose -f docker/docker-compose.yml --profile launcher up
  # ─────────────────────────────────────────────
  khunquant-launcher:
    image: docker.io/cryptoquantumwave/khunquant:launcher
    container_name: khunquant-launcher
    restart: on-failure
    profiles:
      - launcher
    ports:
      - "18800:18800"
      # The gateway's own port is deliberately not published. The launcher on
      # 18800 is the intended entry point, and publishing 18790 puts the gateway
      # - webhooks, pico - on the host network. Uncomment only if you need to
      # reach the gateway directly, and set gateway.host explicitly.
      #- "18790:18790"
    volumes:
      - ./data:/root/.khunquant

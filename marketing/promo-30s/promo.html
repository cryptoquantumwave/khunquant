:root{
  --bg:#f3f4f8; --ink:#16173a; --mute:#8a8fa8; --accent:#5c6bc0; --accent-d:#3e4da0; --accent-l:#e8eaf6;
  --up:#16a34a; --dn:#e11d48; --line-me:#9be27a; --chat:#dde4ee;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
body{font-family:Plex,Kanit,sans-serif;color:var(--ink)}
#stage{position:absolute;inset:0;overflow:hidden;background:radial-gradient(1200px 1400px at 50% 45%,#fbfbfd 0%,#f3f4f8 55%,#e9ebf2 100%)}
#world{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0}

/* ---------- mascot ---------- */
.mascot{position:absolute;display:block}
.mascot svg{width:100%;height:100%;display:block;overflow:visible}
.say{position:absolute;background:#fff;border-radius:36px;padding:22px 34px;font:600 44px/1.3 Kanit;box-shadow:0 10px 30px rgba(22,23,58,.10);white-space:nowrap}
.say:after{content:"";position:absolute;left:50%;bottom:-18px;margin-left:-18px;border:18px solid transparent;border-bottom:0;border-top-color:#fff}
#nametag{position:absolute;font:600 40px Kanit;color:var(--accent-d);letter-spacing:.5px}
#shadowM{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(22,23,58,.18),transparent)}

/* ---------- phone (iPhone-like) ---------- */
#phoneWrap{position:absolute;left:170px;top:200px;width:740px;height:1520px}
#floor{position:absolute;left:90px;right:90px;bottom:-60px;height:90px;border-radius:50%;background:radial-gradient(closest-side,rgba(22,23,58,.22),transparent)}
.btn{position:absolute;width:8px;border-radius:3px;background:linear-gradient(90deg,#8d9097,#d9dbe0 50%,#9a9da4)}
#phone{position:absolute;inset:0;border-radius:118px;padding:9px;
  background:linear-gradient(135deg,#e6e7ea 0%,#9ea1a8 18%,#f2f3f5 38%,#8b8e95 62%,#d7d9dd 82%,#a4a7ad 100%);
  box-shadow:0 50px 90px rgba(22,23,58,.22),0 12px 24px rgba(22,23,58,.12)}
#bezel{position:absolute;inset:9px;border-radius:110px;background:#0b0b0d;padding:13px}
#screen{position:relative;width:696px;height:1476px;border-radius:97px;overflow:hidden;background:#fff}
#island{position:absolute;left:50%;top:22px;width:190px;height:56px;margin-left:-95px;background:#000;border-radius:30px;z-index:90}
#island:after{content:"";position:absolute;right:22px;top:16px;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#2a3350,#07080c 60%)}
#glare{position:absolute;inset:0;border-radius:97px;pointer-events:none;z-index:95;background:linear-gradient(115deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,0) 28%,rgba(255,255,255,0) 70%,rgba(255,255,255,.05) 100%)}
.status{position:absolute;left:0;right:0;top:0;height:96px;display:flex;align-items:center;justify-content:space-between;padding:12px 62px 0 74px;font:600 31px Plex;z-index:40}
.status svg{display:block}
.homebar{position:absolute;left:50%;bottom:12px;width:250px;height:10px;margin-left:-125px;border-radius:6px;background:#111;z-index:92}

/* LINE-like chat */
#chat{position:absolute;inset:0;background:var(--chat)}
#chat .status{background:#fff}
#hdr{position:absolute;top:96px;left:0;right:0;height:104px;background:#fff;display:flex;align-items:center;padding:0 26px 0 18px;gap:16px;border-bottom:1px solid #e6e8ee;z-index:30}
#hdr .nm{font:700 33px Kanit;line-height:1.1}
#hdr .nm small{display:flex;align-items:center;gap:8px;font:500 22px Plex;color:var(--mute)}
#hdr .nm small i{width:12px;height:12px;border-radius:50%;background:#22c55e;display:block}
.av{border-radius:50%;background:var(--accent-l);flex:none;display:grid;place-items:center;overflow:hidden}
.av svg{width:72%;height:72%}
#hdr .icons{margin-left:auto;display:flex;gap:30px}
#vp{position:absolute;top:200px;left:0;right:0;overflow:hidden;z-index:5}
#content{position:absolute;left:0;right:0;top:0;padding:18px 20px 0;display:flex;flex-direction:column;gap:22px}
.date{align-self:center;font:500 22px Plex;color:#fff;background:rgba(60,70,100,.28);padding:6px 20px;border-radius:20px}
.it{display:flex;align-items:flex-end;gap:12px;position:relative}
.it.me{flex-direction:row-reverse}
.it .av{width:60px;height:60px;align-self:flex-start}
.meta{font:500 19px/1.25 Plex;color:#6b7390;flex:none;text-align:right}
.it:not(.me) .meta{text-align:left}
.bub{font:500 31px/1.42 Plex;padding:18px 24px;border-radius:30px;max-width:520px;background:#fff}
.me .bub{background:var(--line-me);color:#10210a}
.dots{position:absolute;left:72px;top:0;background:#fff;border-radius:30px;padding:24px 28px;display:flex;gap:10px}
.dots i{width:14px;height:14px;border-radius:50%;background:#aab0c4;display:block}
.card{width:540px;background:#fff;border-radius:30px;overflow:hidden;font:500 29px/1.42 Plex}
.card .in{padding:24px 26px}
.ct{font:700 32px Kanit;display:flex;align-items:center;gap:12px;margin-bottom:8px}
.pill{font:600 21px Kanit;padding:3px 14px;border-radius:20px;background:var(--accent-l);color:var(--accent-d)}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px}
.big{font:700 62px/1.1 Kanit;letter-spacing:-.5px}
.sub{color:var(--mute);font-size:25px}
.up{color:var(--up)} .dn{color:var(--dn)}
.hr{height:1px;background:#eceef4;margin:14px 0}
.stack{display:flex;height:22px;border-radius:12px;overflow:hidden;background:#eef0f6;margin:14px 0 12px}
.stack i{display:block;height:100%}
.leg3{display:flex;flex-direction:column;gap:6px;font-size:26px}
.sw{display:inline-block;width:18px;height:18px;border-radius:5px;margin-right:10px;vertical-align:-1px}
.weeks{display:flex;gap:8px;margin:10px 0 4px}
.weeks i{flex:1;height:40px;border-radius:10px;background:#eef0f6;display:grid;place-items:center;font:700 20px Kanit;color:#fff}
.ladder{display:flex;gap:10px;align-items:flex-end;height:120px;margin:10px 0 2px}
.ladder i{flex:1;border-radius:10px 10px 4px 4px;background:#eef0f6;display:flex;justify-content:center;padding-top:6px;font:700 21px Kanit;color:#fff;transform-origin:bottom}
.fbtn{border-top:1px solid #eceef4;text-align:center;padding:20px 0;font:600 29px Kanit;color:var(--accent-d);position:relative;overflow:hidden}
.ripple{position:absolute;border-radius:50%;background:rgba(92,107,192,.25);width:40px;height:40px;margin:-20px 0 0 -20px;left:50%;top:50%;opacity:0}
.legs .leg{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:18px;background:#f5f6fa;margin:8px 0}
.tag{font:700 22px Kanit;padding:4px 12px;border-radius:10px}

/* input + keyboard */
#inbar{position:absolute;left:0;right:0;height:104px;background:#fff;display:flex;align-items:center;gap:18px;padding:0 22px;z-index:20;border-top:1px solid #e6e8ee}
#inbox{flex:1;height:68px;border-radius:34px;background:#f1f2f6;display:flex;align-items:center;padding:0 24px;overflow:hidden;font:500 30px Plex;position:relative}
#inbox .ph{color:#a3a8bb;position:absolute;left:24px}
#intext{white-space:nowrap;display:flex;align-items:center;flex:none}
#caret{display:inline-block;width:3px;height:38px;background:#06c755;margin-left:2px}
#sendb{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:#e5e7ee;flex:none}
#homefill{position:absolute;left:0;right:0;bottom:0;height:34px;background:#fff;z-index:19}
#kb{position:absolute;left:0;right:0;bottom:0;height:560px;background:#d3d6dd;z-index:25;padding:14px 8px 0}
.kr{display:flex;justify-content:center;gap:9px;margin-bottom:16px}
.k{height:88px;flex:0 0 48px;border-radius:10px;background:#fff;box-shadow:0 2px 0 #8e9096;display:grid;place-items:center;font:400 38px Plex;color:#111;position:relative}
.k.sp{background:#abb0ba;font:500 26px Plex}
.k.on{background:#c4c8d0}
.k .pop{position:absolute;bottom:60px;left:50%;width:84px;height:100px;margin-left:-42px;border-radius:14px;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.25);display:grid;place-items:center;font:500 52px Plex;opacity:0}
.kbot{display:flex;justify-content:space-between;padding:6px 40px 0}

/* lock screen */
#lock{position:absolute;inset:0;z-index:70;background:linear-gradient(180deg,#d9ddf5 0%,#aab3ea 45%,#6f7ccc 100%);overflow:hidden}
#lock .orb{position:absolute;border-radius:50%;filter:blur(40px)}
#lock .status{color:#fff}
#ldate{position:absolute;top:150px;width:100%;text-align:center;font:600 34px Kanit;color:rgba(255,255,255,.92)}
#lclock{position:absolute;top:190px;width:100%;text-align:center;font:600 196px/1 Plex;color:#fff;letter-spacing:-4px}
#notifs{position:absolute;top:440px;left:22px;right:22px;display:flex;flex-direction:column;gap:16px}
.nt{background:rgba(255,255,255,.72);backdrop-filter:blur(20px);border-radius:40px;padding:22px 24px;display:flex;gap:20px;align-items:flex-start;box-shadow:0 6px 20px rgba(30,30,80,.10);position:relative;overflow:hidden}
.nt .lic{width:72px;height:72px;border-radius:18px;background:#06c755;display:grid;place-items:center;flex:none}
.nt .tx{flex:1;font:500 28px/1.35 Plex;color:#151526}
.nt .tx b{font:700 28px Plex;display:flex;justify-content:space-between}
.nt .tx b span{font:500 23px Plex;color:#5d6178}
#lockbtns{position:absolute;bottom:70px;left:70px;right:70px;display:flex;justify-content:space-between}
#lockbtns i{width:90px;height:90px;border-radius:50%;background:rgba(40,40,70,.25);display:block}
#black{position:absolute;inset:0;background:#000;z-index:80;opacity:0}

/* overlay UI */
#title{position:absolute;left:0;right:0;top:86px;display:flex;justify-content:center;z-index:200}
#title div{background:#fff;border-radius:50px;padding:14px 34px 14px 18px;font:600 38px Kanit;box-shadow:0 8px 30px rgba(22,23,58,.10);display:flex;align-items:center;gap:16px;white-space:nowrap}
#title b{font:700 26px Kanit;color:#fff;background:var(--accent);border-radius:30px;padding:4px 14px}
#foot{position:absolute;left:0;right:0;top:1856px;text-align:center;font:400 22px Plex;color:#9a9fb5;z-index:200}

/* end card */
#end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:150}
#logoWrap{position:relative;width:440px;height:440px;display:grid;place-items:center}
#logoWrap img{width:420px;height:420px}
#flash{position:absolute;width:40px;height:40px;margin:-20px;border-radius:50%;background:#fff;z-index:140;opacity:0}
.wm{font:800 132px/1 Kanit;letter-spacing:-2px;color:#1b1a3a;margin-top:20px}
.thn{font:600 50px Kanit;color:var(--accent);margin-top:8px}
.tagl{font:500 44px/1.4 Kanit;margin-top:34px;color:#3a3d5c}
.chips{display:flex;gap:14px;margin-top:36px}
.chips span{font:600 32px Kanit;padding:10px 26px;border-radius:40px;background:#fff;box-shadow:0 4px 14px rgba(22,23,58,.08)}
.url{margin-top:44px;font:700 54px Kanit;padding:18px 56px;border-radius:60px;background:#1b1a3a;color:#fff}
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <div id="shadowM"></div>
    <div class="mascot" id="peek"></div>
    <div class="say" id="peekSay" style="font-size:40px;padding:12px 24px"></div>

    <div id="phoneWrap">
      <div id="floor"></div>
      <div class="btn" style="left:-7px;top:250px;height:60px"></div>
      <div class="btn" style="left:-7px;top:360px;height:110px"></div>
      <div class="btn" style="left:-7px;top:500px;height:110px"></div>
      <div class="btn" style="right:-7px;top:400px;height:170px"></div>
      <div id="phone"><div id="bezel"><div id="screen">
        <div id="island"></div>

        <div id="chat">
          <div class="status" id="st1"></div>
          <div id="hdr">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#16173a" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>
            <div class="av" style="width:66px;height:66px" data-mascot></div>
            <div class="nm">KhunQuant<small><i></i>ผู้ช่วยดูแลพอร์ต · ออนไลน์</small></div>
            <div class="icons">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#16173a" stroke-width="2"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5" stroke-linecap="round"/></svg>
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#16173a" stroke-width="2" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#16173a" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </div>
          </div>
          <div id="vp"><div id="content"></div></div>
          <div id="inbar">
            <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#16173a" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#16173a" stroke-width="1.9" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#16173a" stroke-width="1.9" stroke-linejoin="round"><rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M5 18l5-5 4 4 2-2 4 4"/></svg>
            <div id="inbox"><span class="ph">Aa</span><span id="intext"><span id="typed"></span><span id="caret"></span></span></div>
            <div id="sendb"><svg width="34" height="34" viewBox="0 0 24 24"><path d="M3 20l18-8L3 4l2.5 8z" fill="#fff"/></svg></div>
          </div>
          <div id="homefill"></div>
          <div id="kb"></div>
        </div>

        <div id="lock">
          <div class="orb" style="width:520px;height:520px;left:-160px;top:760px;background:#8b97e6"></div>
          <div class="orb" style="width:460px;height:460px;right:-180px;top:180px;background:#eef0ff"></div>
          <div class="status" id="st2"></div>
          <div id="ldate">วันอังคารที่ 20 ตุลาคม</div>
          <div id="lclock">14:05</div>
          <div id="notifs"></div>
          <div id="lockbtns"><i></i><i></i></div>
        </div>
        <div id="black"></div>
        <div class="homebar" id="hb"></div>
        <div id="glare"></div>
      </div></div></div>
    </div>

    <div class="mascot" id="hero"></div>
    <div class="say" id="say1">ตลาดวิ่งเร็วทุกวินาที…</div>
    <div class="say" id="say2">ให้ผมช่วยดูพอร์ตให้นะ!</div>
    <div id="nametag">คุณควอนต์</div>
  </div>

  <div id="flash"></div>
  <div id="end">
    <div id="logoWrap"><img src="logo.png" alt=""></div>
    <div class="wm" id="wm">KhunQuant</div>
    <div class="thn" id="thn">คุณควอนต์</div>
    <div class="tagl" id="tagl">ผู้ช่วยดูแลพอร์ตส่วนตัว<br>อยู่ในแชทของคุณ</div>
    <div class="chips" id="chips"><span>LINE</span><span>Telegram</span><span>Discord</span><span>Slack</span></div>
    <div class="url" id="url">khunquant.com</div>

let M = null, CAM = null, LOGO = { x: 540, y: 640 };
const vpH = t => SCREEN_H - HOME - INBAR - kbProg(t) * (KB_H - HOME) - VP_TOP;
function target(t) {
  let bottom = 0;
  ITEMS.forEach((it, i) => {
    if (!(it.t <= t || (it.dots && t >= it.t - .5))) return;
    bottom = Math.max(bottom, M[i].top + (it.t <= t ? M[i].h : M[i].dh));
  });
  return Math.max(0, bottom + 26 - vpH(t));
}
function scrollAt(t) { let s = 0; const N = 12; for (let k = 0; k < N; k++) s += target(t - k * .035); return s / N; }
function scrollSmooth(t) { let s = 0; const N = 6; for (let k = 0; k < N; k++) s += scrollAt(t - k * .04); return s / N; }
function worldOf(el, t) {
  const c0 = content.getBoundingClientRect(), r = el.getBoundingClientRect();
  return { x: M.left0 + (r.left - c0.left) + r.width / 2, y: M.top0 + (r.top - c0.top) - scrollSmooth(t) + r.height / 2 };
}
function setup() {
  $('#world').style.transform = 'none'; content.style.transform = 'none';
  ITEMS.forEach(i => { i.el.style.transform = 'none'; });
  const c0 = content.getBoundingClientRect();
  M = ITEMS.map(i => { const r = i.el.getBoundingClientRect(); return { top: r.top - c0.top, h: r.height, dh: 76 }; });
  M.top0 = c0.top; M.left0 = c0.left;
  const lr = $('#logoWrap').getBoundingClientRect(); LOGO = { x: lr.left + lr.width / 2, y: lr.top + lr.height / 2 };
  // camera keyframes: [t, cx, cy, scale]
  const D = [540, 960, 1], TY = [540, 1060, 1.6], LK = [540, 860, 1.12];
  const b1 = worldOf($('#btnDelta'), 20.9), b2 = worldOf($('#btnChart'), 23.95);
  const BZ1 = [540, b1.y - 80, 1.5], BZ2 = [540, b2.y - 80, 1.5];
  CAM = [[0, ...D], [3.85, ...D], [4.35, ...TY], [6.5, ...TY], [7.15, ...D], [8.3, ...D], [8.9, ...LK], [11.6, ...LK], [12.3, ...D],
    [12.7, ...D], [13.1, ...TY], [14.05, ...TY], [14.6, ...D], [15.4, 540, 1000, 1.06], [16.3, 540, 1000, 1.06], [16.75, ...TY], [18.45, ...TY], [19.0, ...D],
    [20.35, ...D], [20.8, ...BZ1], [21.15, ...BZ1], [21.7, ...D], [23.45, ...D], [23.85, ...BZ2], [24.2, ...BZ2], [24.7, ...D], [26.6, ...D], [27.3, 540, 960, .9], [31, 540, 960, .9]];
}
function camAt(t) {
  let i = 0; while (i < CAM.length - 2 && t > CAM[i + 1][0]) i++;
  const a = CAM[i], b = CAM[i + 1], p = ioC(cl((t - a[0]) / (b[0] - a[0])));
  return [lerp(a[1], b[1], p), lerp(a[2], b[2], p), Math.exp(lerp(Math.log(a[3]), Math.log(b[3]), p))];
}
window.setup = setup;

/* ================= render(t) ================= */
function render(t) {
  // phone entrance / exit
  const rise = oC(P(t, 2.9, .75)), exit = ioC(P(t, 26.7, .6));
  $('#phoneWrap').style.transform = `translateY(${(1 - rise) * 1750 + exit * 260}px) scale(${1 - exit * .25})`;
  $('#phoneWrap').style.opacity = 1 - exit;

  // keyboard + chat scroll
  const kb = kbProg(t);
  $('#kb').style.transform = `translateY(${(1 - kb) * 100}%)`;
  $('#inbar').style.bottom = (HOME + kb * (KB_H - HOME)) + 'px';
  $('#vp').style.height = vpH(t) + 'px';
  content.style.transform = `translateY(${-scrollSmooth(t)}px)`;

  ITEMS.forEach(it => {
    const el = it.el; if (it.t < 0) return;
    const p = P(t, it.t, .4), e = oB(p), dots = el.querySelector('.dots');
    const showDots = it.dots && t >= it.t - .5 && t < it.t;
    [...el.children].forEach(c => { if (c !== dots) c.style.opacity = t >= it.t ? 1 : 0; });
    if (dots) {
      dots.style.opacity = showDots ? 1 : 0;
      [...dots.children].forEach((d, k) => d.style.transform = `translateY(${Math.sin(t * 13 - k * 1.1) * -5}px)`);
      if (showDots) el.querySelector('.av').style.opacity = 1;
    }
    el.style.opacity = (t >= it.t || showDots) ? 1 : 0;
    el.style.transformOrigin = it.k === 'me' ? 'right bottom' : 'left top';
    el.style.transform = t >= it.t ? `translateY(${(1 - oC(p)) * 26}px) scale(${.9 + .1 * e})` : 'none';
  });

  // typing into the input box
  let typed = '', active = null;
  TYPES.forEach(ty => { if (t >= ty.item.type[0] - .3 && t < ty.item.t) { active = ty; typed = ty.g.filter((_, k) => ty.times[k] <= t).join(''); } });
  $('#typed').textContent = typed;
  $('.ph').style.opacity = typed ? 0 : 1;
  $('#caret').style.opacity = active && (typed || Math.floor(t * 2.4) % 2 === 0) ? 1 : 0;
  const box = $('#inbox'), itx = $('#intext'), room = box.clientWidth - 48;
  itx.style.transform = itx.scrollWidth > room ? `translateX(${room - itx.scrollWidth}px)` : 'none';
  $('#sendb').style.background = typed ? '#06c755' : '#e5e7ee';
  letterKeys.forEach(k => { k.classList.remove('on'); k.querySelector('.pop').style.opacity = 0; });
  $('#kspace').classList.remove('on');
  if (active) active.times.forEach((tt, k) => {
    if (t < tt || t >= tt + .1) return;
    const ch = active.g[k];
    const key = ch === ' ' ? $('#kspace') : letterKeys.find(x => x.firstChild.textContent === ch[0]) || letterKeys[(ch.codePointAt(0) * 7) % letterKeys.length];
    key.classList.add('on'); if (key.id !== 'kspace') key.querySelector('.pop').style.opacity = 1;
  });

  // lock screen
  $('#black').style.opacity = t < 8.2 ? 0 : t < 8.4 ? P(t, 8.2, .12) : 1 - P(t, 8.4, .25);
  const unlock = ioC(P(t, 11.95, .5));
  $('#lock').style.display = t >= 8.35 && t < 12.5 ? 'block' : 'none';
  $('#lock').style.transform = `translateY(${-unlock * 100}%)`;
  $('#hb').style.background = t >= 8.35 && t < 12.2 ? '#fff' : '#111';
  NOTIFS.forEach(n => {
    const p = P(t, n.t, .45);
    n.el.style.display = t >= n.t ? 'flex' : 'none';
    n.el.style.opacity = cl(p * 2.5);
    n.el.style.transform = `translateY(${(1 - oB(p)) * -60}px) scale(${.92 + .08 * oB(p)})`;
  });

  TAPS.forEach(x => {
    const el = x.sel(), r = el.querySelector('.ripple'), p = P(t, x.t, .45);
    r.style.opacity = t >= x.t && p < 1 ? (1 - p) : 0; r.style.transform = `scale(${1 + p * 16})`;
    el.style.background = t >= x.t && t < x.t + .5 ? '#eef0fa' : '';
  });

  // card internals
  $('#cntPort').textContent = '฿' + fmt(1248500 * oC(P(t, 14.8, 1.1)));
  [[38, '#sg1', 14.9], [34, '#sg2', 15.05], [28, '#sg3', 15.2]].forEach(([w, id, a]) => $(id).style.width = (w * oC(P(t, a, .5))) + '%');
  $$('#weeks i').forEach((c, k) => { const a = 19.15 + k * .1, on = t >= a, skip = k === 3 || k === 6; c.style.background = on ? (skip ? '#c9cde0' : '#16a34a') : '#eef0f6'; c.textContent = on ? (skip ? '–' : '✓') : ''; c.style.transform = `scale(${on ? oB(P(t, a, .25)) : .85})`; });
  $$('#ladder i').forEach((c, k) => { const p = oC(P(t, 19.5 + k * .14, .35)); c.style.transform = `scaleY(${.25 + .75 * p})`; c.style.background = p > .5 ? '#f59e0b' : '#eef0f6'; });
  $('#beam').setAttribute('transform', `rotate(${t < 21.95 ? -13 : -13 * (1 - oB(P(t, 21.95, .8)))} 244 55)`);
  $('#cntApr').textContent = fmt(14.6 * oC(P(t, 22.1, .9)), 1) + '%';
  $$('#chart .cdl').forEach((c, k) => c.style.opacity = P(t, 24.85 + k * .027, .18));
  $('#ema').style.strokeDashoffset = 1400 * (1 - oC(P(t, 25.0, .8)));
  $('#chart .sr').style.opacity = P(t, 25.5, .3);
  $('#cntPnl').textContent = '+฿' + fmt(18420 * oC(P(t, 26.0, .8)));

  // camera
  const [cx, cy, s] = camAt(t);

  // hero mascot: intro, flies into the chat avatar, returns at the end and turns into the logo
  const hero = $('#hero'), ratio = 112 / 134;
  const intro = oB(P(t, .2, .5));
  let hx = 540, hy = 840, hw = 440, hop = t < 2.85 ? -Math.abs(Math.sin((t - .2) * 3.4)) * 28 : 0;
  const fly = P(t, 2.85, .65), fe = ioC(fly);
  const avX = 299, avY = 370; // chat-header avatar centre in world coords
  if (t >= 2.85) { hx = lerp(540, avX, fe); hy = lerp(840, avY, fe) - Math.sin(fly * Math.PI) * 240; hw = lerp(440, 48, fe); }
  let lx = LOGO.x, ly = LOGO.y; // logo position is in screen space; convert to world
  const fin = P(t, 26.85, .45);
  if (t >= 26.85) { const wx = (lx - (540 - cx * s)) / s, wy = (ly - (960 - cy * s)) / s; hx = lerp(1250, wx, oC(fin)); hy = lerp(1100, wy, oC(fin)) - Math.sin(fin * Math.PI) * 280; hw = lerp(180, 320, fin); hop = 0; }
  hero.style.width = hw + 'px'; hero.style.height = hw * ratio + 'px';
  hero.style.left = (hx - hw / 2) + 'px'; hero.style.top = (hy - hw * ratio / 2 + hop) + 'px';
  hero.style.transform = `scale(${t < 2.85 ? intro : 1})`;
  hero.style.opacity = t < .2 ? 0 : (t >= 3.5 && t < 26.85) || t >= 27.32 ? 0 : 1;
  poseMascot(hero, t, { wave: (t > .5 && t < 2.6) || t > 26.85 });
  $('#shadowM').style.cssText = `left:360px;top:1060px;width:360px;height:60px;opacity:${t < 2.85 ? intro * (1 + hop / 60) : 1 - P(t, 2.85, .25)}`;
  const s1 = P(t, .7, .35), s2 = P(t, 1.8, .35), sOut = P(t, 2.7, .2);
  $('#say1').style.cssText = `left:540px;top:440px;transform:translate(-50%,0) scale(${.6 + .4 * oB(s1)});opacity:${cl(s1 * 2) * (1 - P(t, 1.75, .2))}`;
  $('#say2').style.cssText = `left:540px;top:440px;transform:translate(-50%,0) scale(${.6 + .4 * oB(s2)});opacity:${cl(s2 * 2) * (1 - sOut)}`;
  $('#nametag').style.cssText = `left:540px;top:1110px;transform:translateX(-50%);opacity:${P(t, .9, .4) * (1 - sOut)}`;
  $('#hdr .av').style.opacity = t < 3.45 ? 0 : 1;

  // mascot peeking out from behind the phone
  const peek = $('#peek'), ps = $('#peekSay'); let pv = 0, pp = null;
  PEEKS.forEach(p => { const v = Math.min(oB(P(t, p.a, .4)), 1 - ioC(P(t, p.b - .3, .3))); if (v > pv) { pv = v; pp = p; } });
  if (pp && pv > .01) {
    const w = 170; peek.style.width = w + 'px'; peek.style.height = w * ratio + 'px';
    peek.style.left = (750 + pv * 130) + 'px'; peek.style.top = (pp.y + Math.sin(t * 6) * 6) + 'px';
    peek.style.transform = `rotate(${(1 - pv) * 20 + 10}deg)`; peek.style.opacity = 1;
    poseMascot(peek, t, { wave: true, blinkSeed: 1 });
    const sp = P(t, pp.a + .25, .3);
    ps.textContent = pp.say; ps.style.left = (870 + pv * 60) + 'px'; ps.style.top = (pp.y - 100) + 'px';
    ps.style.opacity = cl(sp * 2) * cl(pv); ps.style.transform = `scale(${oB(sp)})`;
  } else { peek.style.opacity = 0; ps.style.opacity = 0; }

  $('#world').style.transform = `translate(${540 - cx * s}px,${960 - cy * s}px) scale(${s})`;

  // section titles
  let tv = 0, tt = null; TITLES.forEach(x => { const v = Math.min(oC(P(t, x[0], .35)), 1 - P(t, x[1] - .25, .25)); if (v > tv) { tv = v; tt = x; } });
  tv *= cl((1.3 - s) / .2); // keep the title out of zoomed-in shots
  $('#title').style.opacity = tv; $('#title').style.transform = `translateY(${(1 - tv) * -20}px)`;
  if (tt) { $('#tnum').textContent = tt[2]; $('#ttxt').textContent = tt[3]; }
  $('#foot').style.opacity = t > 3.6 && t < 26.7 ? 1 : 0;

  // finale: flash + logo
  const fl = P(t, 27.3, .45), f = $('#flash');
  f.style.left = LOGO.x + 'px'; f.style.top = LOGO.y + 'px';
  f.style.opacity = t >= 27.3 ? (1 - fl) * .95 : 0; f.style.transform = `scale(${1 + oC(fl) * 30})`;
  const lg = oB(P(t, 27.32, .55));
  $('#end').style.opacity = t >= 27.3 ? 1 : 0;
  $('#logoWrap').style.transform = `scale(${lg}) rotate(${(1 - lg) * -40}deg)`;
  const fadeUp = (id, a) => { const p = P(t, a, .45); $(id).style.opacity = cl(p * 2); $(id).style.transform = `translateY(${(1 - oC(p)) * 40}px)`; };
  fadeUp('#wm', 27.6); fadeUp('#thn', 27.8); fadeUp('#tagl', 28.05); fadeUp('#chips', 28.35); fadeUp('#url', 28.65);
}
window.render = render;

const q = new URLSearchParams(location.search);
document.fonts.ready.then(() => {
  setup();
  if (q.has('t')) render(+q.get('t'));
  else if (!q.has('static')) { const t0 = performance.now(); (function loop() { render(((performance.now() - t0) / 1000) % 30); requestAnimationFrame(loop); })(); }
  window.READY = true;
});
</script>
</body>
</html>

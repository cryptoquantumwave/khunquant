# H8: a one-shot price alert must reach the owner after the chat channel comes back.
# The alert is committed (switched off) before it is delivered, so nobody raises it again.
# Design 8.1: the channel is down from +5m to +30m; exactly one owner message follows the
# recovery (+30m..+35m), nothing goes to a stranger or a group, and no duplicate comes later.
#
# Red on the shipped fix (1ee42bc2), and it is not a loss. The alert is a Notice, so it takes
# the ordinary lane (pkg/attention/retry.go): retried 30s, 90s and 150s after each failure,
# bounded by maxQueueAge (6 min, handoff.go) from the decision, then moved to the digest. The
# digest goes out once per local day, at digest_time (08:00) inside the active hours. The alert
# arrives with the next morning's digest, marked late, once; nothing is delivered at +30m because nothing
# retries when the channel recovers. Only a protective Critical keeps retrying for an hour.
# This file keeps the design's expectation; it goes green when a recovered channel is
# followed by delivery of what it missed, or when the design takes the digest as the contract.
version: 1
scenario: alert-survives-channel-outage
covers: [H8]
status: known_bug
known_bug: H8
llm: scripted
level: wire
clock:
  start: "2026-10-20T09:00:00+07:00"
  mode: manual
instance:
  config:
    proactive:
      enabled: true
      owner: { channel: simchat, chat_id: "dm:owner", sender_id: "simchat:owner" }
      attention: { mode: live }
      perception: { enabled: true }
      triggers: { mode: live }
profile:
  timezone: Asia/Bangkok
  active_hours: { start: "07:00", end: "22:00" }
market:
  BTC/USDT: { venue: binance, model: set, price: 98000 }
account:
  binance/main: { balances: { USDT: 10000, BTC: 0.1 } }
setup:
  - call_tool:
      as: owner
      name: set_price_alert
      args: { action: create, provider: binance, symbol: BTC/USDT, condition: above, threshold: 100000, recurring: false }
timeline:
  - at: "+5m"
    chat.channel: { state: down }
  - at: "+6m"
    market.path: { symbol: BTC/USDT, to: 100500, over: 3m, shape: linear }
  - at: "+30m"
    chat.channel: { state: up }
  - run_until: "+2h"
expect:
  - id: crossed
    event: { kind: trigger.candidate, trigger: price_cross, subject: BTC/USDT }
    within: { from: "+6m", to: "+10m" }
  - id: delivered-after-recovery
    message: { to: owner, contains: ["BTC", "100"], count: 1 }
    within: { from: "+30m", to: "+35m" }
  - id: no-leak
    message: { to: [stranger, "group:*"], count: 0 }
  - id: no-duplicate-later
    message: { to: owner, contains: ["BTC"], count: 0 }
    within: { from: "+35m", to: "+2h" }

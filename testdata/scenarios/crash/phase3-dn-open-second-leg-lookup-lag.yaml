# SBX-20, the same crash as phase3-dn-open-second-leg (SIGKILL after the second leg was placed
# and before the workflow journaled it), against a venue whose order lookup lags: the second
# leg (the open puts the futures short first, then buys the spot) exists but cannot be found by
# client ID for 30 minutes of sim time (lookup_lag), far more than the 5 s settle delay after
# which the broker believes an empty lookup (ReconcileSettleDelay) and the 40 s a restart takes.
#
# Expected, and what the scenario asserts: still one spot buy and one futures short. The
# step marked, durably, right before it sent the second leg (journal.Effect), so the restarted
# attempt knows an earlier one may have sent; its lookup finds nothing, and because the venue's
# lookup can lag by any amount that empty answer is not believed. Nothing is placed, the open
# ends in recovery and the owner is told. (Before the mark, the restarted open believed the empty
# lookup after the 5 s settle delay and bought again: two spot buys, a position twice as long as
# its hedge. PHASE3-LOOKUP-LAG.) Controls: phase3-dn-open-second-leg (ordinary lookup, one buy)
# and phase3-dn-open-before-send[-lag] (a crash before the send, with and without a lag: the mark
# was never written, so the restarted open places the leg once and succeeds).
version: 1
scenario: phase3-dn-open-second-leg-lookup-lag
covers: [SBX-20, Phase3]
status: active
llm: scripted
level: wire
clock: { start: "2026-10-20T09:00:00+07:00", mode: manual }
instance:
  accounts: [binance]
  config:
    proactive:
      enabled: true
      owner: { channel: simchat, chat_id: "dm:owner", sender_id: "simchat:owner" }
    tools:
      create_delta_neutral_plan: { enabled: true }
      prepare_delta_neutral_plan: { enabled: true }
      open_delta_neutral_position: { enabled: true }
      get_delta_neutral_plan: { enabled: true }
market:
  BTC/USDT: { venue: binance, model: set, price: 98000 }
account:
  binance: { balances: { USDT: 10000 } }
  binance.spot: { balances: { USDT: 10000 } }
faults:
  - match: { venue: binance, order: create, market: spot }
    effect: { order: lookup_lag, lag: 30m }
llm_script:
  - id: open
    match: { sender: "simchat:owner", prompt_contains: ["open the plan"] }
    respond: { tool: open_delta_neutral_position, args: { plan_id: 1, confirm: true } }
    times: 1
  - id: any
    match: {}
    respond: { text: "ok" }
setup:
  - call_tool:
      as: owner
      name: create_delta_neutral_plan
      args: { plan_name: btc-hedge, asset: BTC, spot_provider: binance, spot_symbol: BTC/USDT, futures_provider: binance, futures_symbol: "BTC/USDT:USDT", capital_usdt: 1000, leverage: 1 }
  - call_tool:
      as: owner
      name: prepare_delta_neutral_plan
      args: { plan_id: 1 }
  - restart: { kill_at: { workflow: dn.open, step: place_second_leg, point: after_fn } }
  - chat: { as: owner, text: "open the plan" }
timeline:
  - advance: 2m # past the dead process's lease (30 s) and grace (10 s)
  - advance: 10m
expect:
  - id: crashed-at-the-second-leg
    event: { kind: crash, fields: { kind: dn.open, step: place_second_leg, point: after_fn }, count: 1 }
  - id: one-open-workflow
    workflow: { kind: dn.open, state: succeeded }
    count: 1
  - id: one-spot-buy
    order: { venue: binance, symbol: BTC/USDT, side: buy, count: 1 }
  - id: one-futures-short
    order: { venue: binance, symbol: "BTC/USDT:USDT", side: sell, count: 1 }
  - id: the-owner-is-told-the-leg-is-unproven
    message: { to: owner, contains: ["second leg not placed (unknown)"], count: 1 }

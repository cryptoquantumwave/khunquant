# S108C-2: when a plan's mandate has expired the owner is asked, and the plan's old scheduled
# job does not quietly go back to buying.
#
# What it proves, and what it does not. There is no credentialed exchange account in the lab,
# so no order can be placed and an `order` check would pass whatever happened; the scenario
# reads the cron job's turn instead. The script plays the model the job wakes: it calls
# execute_dca_order, and a tool.call for it means the old scheduled path got as far as trying
# a buy (here it ends in an error). The control: while the mandate lives the job's gate stops
# it before any turn (check 2 passes), and a plan with no mandate shows the call at its first
# slot. So "no-legacy-buy-after-expiry" proves no attempt, not no fill. "asked" is a check on
# wording ("mandate"); the approval confirmation at +0 carries the word, so the matcher can
# see it.
#
# The timeline is 17 steps of 48 h on purpose: one advance call has a 20 s wall budget and a
# settle in flight at its end was seen journaled as failed, which fails the run (see the PR).
# Red today: the mandate expires after one month (mandate_months: 1) and the next slots are
# bought by the cron job; the owner hears nothing about it.
version: 1
scenario: expired-mandate-asks-owner
covers: [S108C-2]
status: known_bug
known_bug: S108C-2
llm: scripted
level: wire
clock: { start: "2026-10-20T09:00:00+07:00", mode: manual }
instance:
  config:
    exchanges: { binance: { enabled: true, accounts: [{ name: main }] } }
    proactive:
      enabled: true
      owner: { channel: simchat, chat_id: "dm:owner", sender_id: "simchat:owner" }
      attention: { mode: live }
      perception: { enabled: true }
      triggers: { mode: live }
      approvals: { enabled: true }
      mandates: { enabled: true }
profile:
  timezone: Asia/Bangkok
  active_hours: { start: "07:00", end: "22:00" }
market:
  BTC/USDT: { venue: binance, model: set, price: 98000 }
account:
  binance/main: { balances: { USDT: 100000 } }
llm_script:
  - id: legacy-buy
    match: { turn: cron_legacy, prompt_contains: ["[DCA-AUTO]"] }
    respond: { tool: execute_dca_order, args: { plan_id: 1 } }
  - id: any
    match: {}
    respond: { text: "ok" }
setup:
  - call_tool:
      as: owner
      name: create_dca_plan
      args: { plan_name: btc-daily, provider: binance, symbol: BTC/USDT, amount_per_order: 100, schedule: { cron: "0 10 * * *", timezone: Asia/Bangkok }, propose_mandate: true, mandate_months: 1 }
  - chat.press:
      on: { to: "dm:owner", contains: ["Allow KhunQuant to BUY"] }
      action: approve
timeline:
  - advance: 48h
  - advance: 48h
  - advance: 48h
  - advance: 48h
  - advance: 48h
  - advance: 48h
  - advance: 48h
  - advance: 48h
  - advance: 48h
  - advance: 48h
  - advance: 48h
  - advance: 48h
  - advance: 48h
  - advance: 48h
  - advance: 48h
  - advance: 48h
  - advance: 48h
expect:
  - id: asked
    message: { to: owner, contains: ["mandate"], count: ">= 1" }
    within: { from: "744h", to: "816h" }
  - id: legacy-job-stood-down-while-the-mandate-lived
    event: { kind: tool.call, fields: { name: execute_dca_order } }
    within: { from: "0h", to: "743h" }
    count: 0
  - id: no-legacy-buy-after-expiry
    event: { kind: tool.call, fields: { name: execute_dca_order } }
    within: { from: "744h", to: "816h" }
    count: 0

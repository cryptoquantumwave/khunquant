# S108C-2, decided by the owner on 2026-11-02: when a plan's mandate expires the plan goes
# back to its scheduled job, and the owner is told once. See "Cron hand-over" in SECURITY.md.
#
# What it proves, and what it does not. There is no credentialed exchange account in the lab,
# so no order can be placed and an `order` check would pass whatever happened; the scenario
# reads the cron job's turn instead. The script plays the model the job wakes: it calls
# execute_dca_order, and a tool.call for it means the scheduled path got as far as trying a
# buy (here it ends in an error). The control: while the mandate lives the job's gate stops
# it before any turn. So "job-runs-after-expiry" proves an attempt, not a fill. The notice is
# matched by its own words, because the approval confirmation at +0 says "mandate" too; the
# window would hide that one, and the second check proves the notice needs the expiry.
#
# One long advance (816 h, 34 days) on purpose: it takes several wall-budget calls and each
# one must settle before it moves. The mandate lasts a month (mandate_months: 1), so it ends
# at +744 h, an hour before that day's slot, and three slots fall in the window.
version: 1
scenario: expired-mandate-returns-to-job
covers: [S108C-2]
status: active
llm: scripted
level: wire
clock: { start: "2026-10-20T09:00:00+07:00", mode: manual }
instance:
  config:
    exchanges: { binance: { enabled: true, accounts: [{ name: main }] } }
    proactive:
      enabled: true
      owner: { channel: simchat, chat_id: "dm:owner", sender_id: "simchat:owner" }
      attention: { mode: live }
      perception: { enabled: true }
      triggers: { mode: live }
      approvals: { enabled: true }
      mandates: { enabled: true }
profile:
  timezone: Asia/Bangkok
  active_hours: { start: "07:00", end: "22:00" }
market:
  BTC/USDT: { venue: binance, model: set, price: 98000 }
account:
  binance/main: { balances: { USDT: 100000 } }
llm_script:
  - id: legacy-buy
    match: { turn: cron_legacy, prompt_contains: ["[DCA-AUTO]"] }
    respond: { tool: execute_dca_order, args: { plan_id: 1 } }
  - id: any
    match: {}
    respond: { text: "ok" }
setup:
  - call_tool:
      as: owner
      name: create_dca_plan
      args: { plan_name: btc-daily, provider: binance, symbol: BTC/USDT, amount_per_order: 100, schedule: { cron: "0 10 * * *", timezone: Asia/Bangkok }, propose_mandate: true, mandate_months: 1 }
  - chat.press:
      on: { to: "dm:owner", contains: ["Allow KhunQuant to BUY"] }
      action: approve
timeline:
  - advance: 816h
expect:
  - id: told-once
    message: { to: owner, contains: ["mandate expired", "back on its scheduled job"], count: 1 }
    within: { from: "744h", to: "816h" }
  - id: no-notice-while-the-mandate-lived
    message: { to: owner, contains: ["mandate expired"], count: 0 }
    within: { from: "0h", to: "743h" }
  - id: job-stood-down-while-the-mandate-lived
    event: { kind: tool.call, fields: { name: execute_dca_order } }
    within: { from: "0h", to: "743h" }
    count: 0
  - id: job-runs-after-expiry
    event: { kind: tool.call, fields: { name: execute_dca_order } }
    within: { from: "744h", to: "816h" }
    count: 3

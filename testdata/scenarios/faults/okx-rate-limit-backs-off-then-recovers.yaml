# P2B-5: a transient OKX 429 on the perception market source. Two OKX price alerts make the
# source read both symbols with one batch call, GET /api/v5/market/tickers. From +1m to +5m
# (sim time) OKX answers that call with its real rate-limit error ({"code":"50011"}, HTTP
# 429), which the pinned ccxt turns into RateLimitExceeded. BTC crosses its line at about
# +2m20s, inside the window. The source must back off, not read a false price and not raise the
# alert while OKX is limiting, and then recover: the alert comes once the pause is over. The
# pause outlasts the fault (the source's backoff doubles), so the alert comes at about +8m,
# not at +5m; the checks leave a minute of margin on either side of that.
# Control: without the fault step the candidate is seen at +3m, the source's next one-minute
# poll after the crossing, so the first check below fails.
version: 1
scenario: okx-rate-limit-backs-off-then-recovers
covers: [P2B-5]
llm: scripted
level: wire
clock: { start: "2026-10-20T09:00:00+07:00", mode: manual }
instance:
  config:
    proactive:
      enabled: true
      owner: { channel: simchat, chat_id: "dm:owner", sender_id: "simchat:owner" }
      attention: { mode: live }
      perception: { enabled: true }
      triggers: { mode: live }
profile:
  timezone: Asia/Bangkok
  active_hours: { start: "07:00", end: "22:00" }
market:
  BTC/USDT: { venue: okx, model: set, price: 98000 }
  ETH/USDT: { venue: okx, model: set, price: 3500 }
setup:
  - call_tool:
      as: owner
      name: set_price_alert
      args: { action: create, provider: okx, symbol: BTC/USDT, condition: above, threshold: 99000, recurring: false }
  - call_tool:
      as: owner
      name: set_price_alert
      args: { action: create, provider: okx, symbol: ETH/USDT, condition: above, threshold: 9999, recurring: false }
timeline:
  - at: "+1m"
    fault.add:
      match: { venue: okx, path_prefix: /api/v5/market/tickers }
      effect: { error: rate_limit }
      when: { from: "+0m", to: "+4m" }
  - at: "+2m"
    market.path: { symbol: BTC/USDT, to: 100500, over: 1m, shape: linear }
  - run_until: "+20m"
expect:
  - id: nothing-while-okx-is-limiting-or-the-source-is-backed-off
    event: { kind: trigger.candidate, trigger: price_cross, subject: BTC/USDT }
    count: 0
    within: { from: "+1m", to: "+6m" }
  - id: recovers-after-the-pause
    event: { kind: trigger.candidate, trigger: price_cross, subject: BTC/USDT }
    within: { from: "+6m", to: "+20m" }

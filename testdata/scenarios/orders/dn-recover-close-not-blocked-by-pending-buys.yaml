# HYP-4: the protective close of an orphaned DN leg shares the three-pending-proposals bound with
# the owner's own risk-increasing buys, so it can be refused for 15 minutes or more while the
# position is naked. The lab form of the gated unit reproducer (KQ_REPRO_HYP4, PR 252).
#
# Observed (B3 log, binance): the owner's chat turn left 3 pending buy proposals (ETH 0.01, 0.02,
# 0.03; origin owner, not reducing). The open of plan 1 then ran with the spot buy refused
# (insufficient_funds), the futures short filled, and recovery started. Its critical alert was
# delivered, but no card and no proposal followed. The log held: "Could not propose closing the
# orphan ... approval: 3 proposals are already waiting for a decision". The owner's buys expired
# at +15m; the second recovery round at +30m made the card. The close was 30 minutes late.
#
# Why each piece of setup is there:
#  - approvals on with a 15 minute expiry, because the close is an approval proposal and the owner's
#    cards must still be pending when recovery runs;
#  - the owner's chat turn calls propose_order three times, in one answer sequence, and the owner
#    does not decide them (no press), so three pending order proposals sit against MaxPending;
#  - the spot buy of the open is refused by a fault (insufficient_funds), so the futures short is an orphan;
#  - clock.resolution 1s, because the open and the close are verified workflows.
#
# The correct behaviour: the reduce-only close proposal exists within 5 minutes of the failed open,
# whatever else the owner has pending. The check is on a proposal created with origin proactive (the
# close; the owner's own are origin owner) and on the card the owner is sent.
#
# Fix direction (log): an exit proposal does not share the bound that the owner's risk-increasing
# proposals fill; a protective close always gets a card (the hourly bound is the same class of bug).
version: 1
scenario: dn-recover-close-not-blocked-by-pending-buys
covers: [HYP-4]
status: known_bug
known_bug: HYP-4
llm: scripted
level: wire
clock: { start: "2026-11-16T10:00:00+07:00", mode: manual, resolution: 1s }
instance:
  accounts: [binance]
  config:
    proactive:
      enabled: true
      owner: { channel: simchat, chat_id: "dm:owner", sender_id: "simchat:owner" }
      attention: { mode: live }
      perception: { enabled: true }
      triggers: { mode: live }
      approvals: { enabled: true, expiry_minutes: 15 }
    tools:
      create_delta_neutral_plan: { enabled: true }
      prepare_delta_neutral_plan: { enabled: true }
      open_delta_neutral_position: { enabled: true }
      get_delta_neutral_plan: { enabled: true }
profile:
  timezone: Asia/Bangkok
  active_hours: { start: "07:00", end: "22:00" }
market:
  BTC/USDT: { venue: binance, model: set, price: 98000 }
  ETH/USDT: { venue: binance, model: set, price: 3000 }
account:
  binance: { balances: { USDT: 10000 } }
  binance.spot: { balances: { USDT: 10000 } }
llm_script:
  # One rule is one tool call, and a proposal's result does not name its size, so the next buy is
  # chosen by the order of the rules (each is used once): after a propose_order, 0.02 and then 0.03.
  - id: buy-2
    match: { last_tool: propose_order }
    respond: { tool: propose_order, args: { provider: binance, symbol: ETH/USDT, side: buy, type: market, amount: 0.02 } }
    times: 1
  - id: buy-3
    match: { last_tool: propose_order }
    respond: { tool: propose_order, args: { provider: binance, symbol: ETH/USDT, side: buy, type: market, amount: 0.03 } }
    times: 1
  - id: buy-1
    match: { sender: "simchat:owner", prompt_contains: ["queue some eth buys"] }
    respond: { tool: propose_order, args: { provider: binance, symbol: ETH/USDT, side: buy, type: market, amount: 0.01 } }
    times: 1
  - id: open
    match: { sender: "simchat:owner", prompt_contains: ["open the plan"] }
    respond: { tool: open_delta_neutral_position, args: { plan_id: 1, confirm: true } }
    times: 1
  - id: any
    match: {}
    respond: { text: "ok" }
setup:
  - call_tool:
      as: owner
      name: create_delta_neutral_plan
      args: { plan_name: btc-hedge, asset: BTC, spot_provider: binance, spot_symbol: BTC/USDT, futures_provider: binance, futures_symbol: "BTC/USDT:USDT", capital_usdt: 1000, leverage: 1 }
  - call_tool:
      as: owner
      name: prepare_delta_neutral_plan
      args: { plan_id: 1 }
  - chat: { as: owner, text: "queue some eth buys" }
  - fault.add:
      match: { venue: binance, order: create, market: spot }
      effect: { order: reject, code: insufficient_funds }
  - chat: { as: owner, text: "open the plan" }
timeline:
  - run_until: "+10m"
expect:
  # Setup proof: three owner proposals are pending, the short was placed, the spot buy was not,
  # and the owner was told the position is unhedged.
  - id: three-owner-buys-pending
    event: { kind: proposal, fields: { event.payload.origin: owner, event.payload.status: pending } }
    count: 3
  - id: the-short-was-placed
    order: { venue: binance, symbol: "BTC/USDT:USDT", side: sell, count: 1 }
  - id: no-spot-buy
    order: { venue: binance, symbol: BTC/USDT, side: buy, count: 0 }
    within: { from: "+0m", to: "+10m" }
  - id: owner-told-it-is-unhedged
    message: { to: owner, severity: critical, contains: ["UNHEDGED"], count: ">= 1" }
    within: { from: "+0m", to: "+5m" }
  # The correct behaviour.
  - id: close-proposal-created-within-5m
    event: { kind: proposal, fields: { event.payload.origin: proactive, event.payload.status: pending } }
    count: ">= 1"
    within: { from: "+0m", to: "+5m" }
  - id: close-card-delivered-within-5m
    message: { to: owner, contains: ["reduce-only"], count: ">= 1" }
    within: { from: "+0m", to: "+5m" }

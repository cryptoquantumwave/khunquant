# S108A-1, the hedge-rejected variant: the futures short of a delta-neutral open fills, and
# the venue then refuses the spot buy that hedges it. The open must not end holding a short
# with no hedge: either the short is closed again (a reduce-only buy) or the spot leg went
# through. The refusal is a rejected create (insufficient funds), which is a definite no.
#
# Today the short stays open: the open ends in "recovery", the recovery workflow finds the
# orphan short, raises an alert that is not delivered at once, and waits. Nothing closes it.
#
# The design also asks for a futures-leg latency and a +0.6 % move while it lasts. That
# cannot run in the lab today: the open tool waits up to 60 s of wall time for its workflow,
# a latency is held in sim time, and a step's settle gives up at 25 s, so the clock never
# moves. See dn-open-twice-opens-once.
version: 1
scenario: dn-rejected-hedge-leaves-no-naked-short
covers: [S108A-1]
status: known_bug
known_bug: S108A-1
llm: scripted
level: wire
clock: { start: "2026-10-20T09:00:00+07:00", mode: manual }
instance:
  accounts: [binance]
  config:
    proactive:
      enabled: true
      owner: { channel: simchat, chat_id: "dm:owner", sender_id: "simchat:owner" }
    tools:
      create_delta_neutral_plan: { enabled: true }
      prepare_delta_neutral_plan: { enabled: true }
      open_delta_neutral_position: { enabled: true }
      get_delta_neutral_plan: { enabled: true }
market:
  BTC/USDT: { venue: binance, model: set, price: 98000 }
account:
  binance: { balances: { USDT: 10000 } }
  binance.spot: { balances: { USDT: 10000 } }
llm_script:
  - id: open
    match: { sender: "simchat:owner", prompt_contains: ["open the plan"] }
    respond: { tool: open_delta_neutral_position, args: { plan_id: 1, confirm: true } }
    times: 1
  - id: any
    match: {}
    respond: { text: "ok" }
setup:
  - call_tool:
      as: owner
      name: create_delta_neutral_plan
      args: { plan_name: btc-hedge, asset: BTC, spot_provider: binance, spot_symbol: BTC/USDT, futures_provider: binance, futures_symbol: "BTC/USDT:USDT", capital_usdt: 1000, leverage: 1 }
  - call_tool:
      as: owner
      name: prepare_delta_neutral_plan
      args: { plan_id: 1 }
  - fault.add:
      match: { venue: binance, order: create, market: spot }
      effect: { order: reject, code: insufficient_funds }
  - chat: { as: owner, text: "open the plan" }
timeline:
  - advance: 10m
expect:
  - id: the-short-was-placed
    order: { venue: binance, symbol: "BTC/USDT:USDT", side: sell, count: 1 }
  - id: the-short-was-closed-again
    order: { venue: binance, symbol: "BTC/USDT:USDT", side: buy, reduce_only: true, count: 1 }
  - id: no-spot-buy
    order: { venue: binance, symbol: BTC/USDT, side: buy, count: 0 }

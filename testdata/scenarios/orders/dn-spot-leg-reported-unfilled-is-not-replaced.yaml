# S108A-5: the venue fills the spot leg of a delta-neutral open, but its create answer says
# nothing was filled (create_reports_fill with reported 0). The open must read the order back
# and take it as filled, not place the leg again: one spot buy, one futures short, one
# position. A second spot buy would leave the plan holding twice the spot it hedges.
version: 1
scenario: dn-spot-leg-reported-unfilled-is-not-replaced
covers: [S108A-5]
status: active
llm: scripted
level: wire
clock: { start: "2026-10-20T09:00:00+07:00", mode: manual }
instance:
  accounts: [binance]
  config:
    proactive:
      enabled: true
      owner: { channel: simchat, chat_id: "dm:owner", sender_id: "simchat:owner" }
    tools:
      create_delta_neutral_plan: { enabled: true }
      prepare_delta_neutral_plan: { enabled: true }
      open_delta_neutral_position: { enabled: true }
      get_delta_neutral_plan: { enabled: true }
market:
  BTC/USDT: { venue: binance, model: set, price: 98000 }
account:
  binance: { balances: { USDT: 10000 } }
  binance.spot: { balances: { USDT: 10000 } }
setup:
  - call_tool:
      as: owner
      name: create_delta_neutral_plan
      args: { plan_name: btc-hedge, asset: BTC, spot_provider: binance, spot_symbol: BTC/USDT, futures_provider: binance, futures_symbol: "BTC/USDT:USDT", capital_usdt: 1000, leverage: 1 }
  - call_tool:
      as: owner
      name: prepare_delta_neutral_plan
      args: { plan_id: 1 }
  - fault.add:
      match: { venue: binance, order: create, market: spot }
      effect: { order: create_reports_fill, reported: 0 }
  - call_tool:
      as: owner
      name: open_delta_neutral_position
      args: { plan_id: 1, confirm: true }
timeline:
  - advance: 10m
expect:
  - id: one-open-workflow
    workflow: { kind: dn.open }
    count: 1
  - id: spot-leg-placed-once
    order: { venue: binance, symbol: BTC/USDT, side: buy, count: 1 }
  - id: spot-leg-filled
    order: { venue: binance, symbol: BTC/USDT, status: filled, count: 1 }
  - id: futures-leg-placed-once
    order: { venue: binance, symbol: "BTC/USDT:USDT", side: sell, count: 1 }

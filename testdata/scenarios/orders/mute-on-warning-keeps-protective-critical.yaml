# S116A-1 (and A106-1): muting a Warning must not mute the protective Critical that follows.
# move_vs_vol gives the Warning and the protective Critical one dedup key, and the Mute
# button makes an exact mute on it. The floor is lowered to 3 % so that a -10 % move is
# tier 3 without being protective (protective: tier 3, move >= 15 %, weight >= 10 %). The
# 1 h window needs a reference price from an hour earlier, hence the flat 75 minutes.
version: 1
scenario: mute-on-warning-keeps-protective-critical
covers: [S116A-1, A106-1]
status: known_bug
known_bug: S116A-1
llm: scripted
level: wire
clock: { start: "2026-10-26T09:00:00+07:00", mode: manual }
instance:
  accounts: [binance]   # the portfolio weight that makes a Warning model-composed comes from this account
  config:
    proactive:
      enabled: true
      owner: { channel: simchat, chat_id: "dm:owner", sender_id: "simchat:owner" }
      attention: { mode: live }
      perception: { enabled: true }
      triggers:
        mode: live
        params:
          move_vs_vol: { floor_crypto_pct: 3 }
      learning: { enabled: true }
profile:
  timezone: Asia/Bangkok
  active_hours: { start: "07:00", end: "22:00" }
market:
  BTC/USDT: { venue: binance, model: set, price: 98000 }
account:
  binance.spot: { balances: { USDT: 10000, BTC: 0.1 } }
llm_script:
  - id: warn
    match: { turn: proactive }
    respond: { tool: respond_proactive, args: { decision: notify, text: "BTC fell about 10% in the last hour." } }
timeline:
  - run_until: "+75m"
  - market.path: { symbol: BTC/USDT, to: 88200, over: 30m, shape: linear }
  - run_until: "+115m"
  - chat.press:
      on: { to: "dm:owner", severity: warning, contains: ["BTC"] }
      action: mute
  - market.path: { symbol: BTC/USDT, to: 82300, over: 10m, shape: linear }
  - run_until: "+150m"
expect:
  - id: warning-sent-with-buttons
    message: { to: owner, severity: warning, contains: ["BTC"], buttons: [mute], count: 1 }
    within: { from: "+75m", to: "+115m" }
  - id: critical-still-delivered
    message: { to: owner, severity: critical, contains: ["BTC"], count: ">= 1" }
    within: { from: "+115m", to: "+150m" }
  - id: not-dropped-as-muted
    decision: { trigger: move_vs_vol, severity: critical, reason: "!muted" }

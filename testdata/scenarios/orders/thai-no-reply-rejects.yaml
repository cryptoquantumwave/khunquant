# FIX-REPLY (U-T18): a reply of "ไม่" (Thai "no") to a pending card, from the owner in the owner chat,
# rejects it, as the Reject button and /reject do: exactly that proposal is cancelled, nothing is
# placed, and the reply does not reach the agent. The twin thai-yes-reply-approves approves.
version: 1
scenario: thai-no-reply-rejects
covers: [FIX-REPLY, B3-9, D-1]
status: active
llm: scripted
level: wire
clock: { start: "2026-11-16T10:00:00+07:00", mode: manual, resolution: 1s }
instance:
  accounts: [binance]
  config:
    proactive:
      enabled: true
      owner: { channel: simchat, chat_id: "dm:owner", sender_id: "simchat:owner" }
      approvals: { enabled: true, expiry_minutes: 15 }
profile:
  timezone: Asia/Bangkok
  active_hours: { start: "07:00", end: "22:00" }
market:
  BTC/USDT: { venue: binance, model: set, price: 98000 }
account:
  binance.spot: { balances: { USDT: 1000, BTC: 0.05 } }
llm_script:
  - id: propose-sell
    match: { sender: "simchat:owner", prompt_contains: ["trim my btc"] }
    respond: { tool: propose_order, args: { provider: binance, symbol: BTC/USDT, side: sell, type: market, amount: 0.01, rationale: "Trim spot to cut risk." } }
    times: 1
  - id: any
    match: {}
    respond: { text: "ok" }
setup:
  - chat: { as: owner, text: "please trim my btc" }
timeline:
  - advance: 1m
  - chat: { as: owner, text: "ไม่", reply_to: sc-1 }
  - advance: 5m
expect:
  - id: propose-order-was-reached
    event: { kind: tool.call, fields: { name: propose_order } }
    count: 1
  - id: card-delivered
    message: { to: owner, contains: ["SELL 0.01 BTC"], buttons: [approve], count: 1 }
  - id: proposal-rejected
    proposal: { kind: order, status: rejected }
    count: 1
  - id: not-approved
    proposal: { kind: order, status: approved }
    count: 0
    within: { from: "+0m", to: "+6m" }
  - id: no-order-placed
    order: { venue: binance, symbol: BTC/USDT, side: sell }
    count: 0
    within: { from: "+0m", to: "+6m" }
  - id: rejection-said-so
    message: { to: owner, contains: ["Nothing was placed"], count: 1 }
  # The proposing turn makes two model calls; a third would be the "no" going to the agent as chat.
  - id: reply-did-not-reach-the-agent
    llm: {}
    count: 2

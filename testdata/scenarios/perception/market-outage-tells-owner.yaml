# O-13 (S3, fixed): a 30-minute market-data outage must tell the owner that the market source is
# blind, so the price alerts that rely on it are known to be blind. The owner has "BTC above
# 99000" on Binance; Binance answers the ticker reads (GET /api/v3/ticker...) with its
# rate-limit error from +1m to +31m, and the market source backs off. Inside the outage BTC goes
# 98000 -> 100000 -> 98000, a real excursion over the line that nobody can see (that stays
# unseen: the notice is what tells the owner they were blind).
# The market source is one of data_stale's sources (portfolioConfig in
# cmd/khunquant/internal/gateway/portfolio_triggers_wiring.go), Active while a crypto price is
# demanded. The source reports the provider degraded once, after three failed polls (about +8m),
# and backs off without a second report, so the notice that fires is "Data source unreadable:
# market" (pkg/triggers/datastale.go, StaleSource.UnreadableAfter 1), at about +8m.
# The check is a message to the owner naming "market" (the portfolio notice does not contain
# it) within +1m..+45m, which covers the outage and the recovery.
# Setup proof in the same file: the fault really blinded the source (no crossing was seen in
# the gap; the sibling active file market-outage-no-false-cross shows that the same run
# without the fault sees the crossing at +10m) and the alert is still live afterwards (one
# crossing after the outage), so the notice is not a dead alert or a missing fault.
version: 1
scenario: market-outage-tells-owner
covers: [O-13]
status: active
llm: scripted
level: wire
clock: { start: "2026-10-20T09:00:00+07:00", mode: manual }
instance:
  config:
    proactive:
      enabled: true
      owner: { channel: simchat, chat_id: "dm:owner", sender_id: "simchat:owner" }
      attention: { mode: live }
      perception: { enabled: true }
      triggers: { mode: live }
profile:
  timezone: Asia/Bangkok
  active_hours: { start: "07:00", end: "22:00" }
market:
  BTC/USDT: { venue: binance, model: set, price: 98000 }
setup:
  - call_tool:
      as: owner
      name: set_price_alert
      args: { action: create, provider: binance, symbol: BTC/USDT, condition: above, threshold: 99000, recurring: false }
timeline:
  - at: "+1m"
    fault.add:
      match: { venue: binance, path_prefix: /api/v3/ticker }
      effect: { error: rate_limit }
      when: { from: "+0m", to: "+30m" }
  - at: "+5m"
    market.path: { symbol: BTC/USDT, to: 100000, over: 10m, shape: linear }
  - at: "+15m"
    market.path: { symbol: BTC/USDT, to: 98000, over: 10m, shape: linear }
  - run_until: "+50m"
  - market.path: { symbol: BTC/USDT, to: 100500, over: 3m, shape: linear }
  - run_until: "+70m"
expect:
  - id: owner-is-told-the-market-source-is-quiet
    message: { to: owner, contains: ["market"] }
    count: ">= 1"
    within: { from: "+1m", to: "+45m" }
  - id: the-fault-fired-on-the-ticker-reads
    event: { kind: fault.fired, fields: { venue: binance } }
    count: ">= 1"
    within: { from: "+1m", to: "+31m" }
  - id: the-outage-blinded-the-source
    event: { kind: trigger.candidate, trigger: price_cross, subject: BTC/USDT }
    count: 0
    within: { from: "+1m", to: "+31m" }
  - id: the-alert-is-still-live-and-crosses-once-afterwards
    event: { kind: trigger.candidate, trigger: price_cross, subject: BTC/USDT }
    count: 1
    within: { from: "+50m", to: "+70m" }

# S110B-7: the news source takes two pages on two *.github.io sites as "two independent
# sites". github.io is on the public-suffix list, so alice.github.io and bob.github.io are
# two registrable domains although anyone can publish both in a minute. Two pages that tell
# the same invented story (a hack of the owner's BTC venue, high magnitude) then corroborate
# each other, and a high-magnitude item on a holding of 10 % or more is a notice to the owner.
# The search rule is what web_search returns for "BTC news", the page rules are what the news
# source fetches, and the scripted Complete is the model's parse of each page. Expected, and
# what the scenario asserts: no news message reaches the owner.
# The positive checks show that news ran end to end (searched, fetched both pages, parsed
# both) so that "no message" cannot come from a source that never started.
# Control: s110b7-control-independent-sites, the same story on two sites that really are two:
# there the notice is delivered, so the key check here can fail and the pipeline is whole.
version: 1
scenario: s110b7-fake-news
covers: [S110B-7]
status: known_bug
known_bug: S110B-7
llm: scripted
level: wire
clock: { start: "2026-10-26T09:00:00+07:00", mode: manual }
instance:
  accounts: [binance]   # the holding the news is about, and its weight
  config:
    proactive:
      enabled: true
      owner: { channel: simchat, chat_id: "dm:owner", sender_id: "simchat:owner" }
      attention: { mode: live }
      perception: { enabled: true }
      triggers: { mode: live }
      cognition: { enabled: true }
      news: { enabled: true, interval_minutes: 10 }
profile:
  timezone: Asia/Bangkok
  active_hours: { start: "07:00", end: "22:00" }
market:
  BTC/USDT: { venue: binance, model: set, price: 98000 }
account:
  binance.spot: { balances: { USDT: 10000, BTC: 1 } }
web:
  - search: "BTC news"
    results:
      - { title: "Exchange hacked, BTC withdrawals frozen", url: "https://alice.github.io/news/btc-exchange-hack", description: "Breaking." }
      - { title: "BTC exchange hack confirmed", url: "https://bob.github.io/news/btc-exchange-hack", description: "Confirmed." }
  - url_pattern: "alice.github.io/news/*"
    body: "<html><body><h1>Major exchange hacked</h1><p>Attackers drained the hot wallets of a major exchange today. BTC withdrawals are frozen.</p></body></html>"
  - url_pattern: "bob.github.io/news/*"
    body: "<html><body><h1>Exchange hack confirmed</h1><p>A major exchange confirmed that attackers drained its hot wallets today. BTC withdrawals are frozen.</p></body></html>"
llm_script:
  - id: parse
    match: { complete: news }
    respond:
      text: '{"asset":"BTC","relevant":true,"direction":"down","magnitude":"high","event_type":"hack","published_at":"2026-10-26T01:00:00Z","summary":"A major exchange was hacked and BTC withdrawals are frozen."}'
timeline:
  - run_until: "+90m"
expect:
  - id: news-searched
    web: { host: api.search.brave.com, count: ">= 1" }
  - id: news-fetched-both-pages
    web: { host: github.io, count: ">= 2" }
  - id: news-parsed-both-pages
    llm: { turn: complete }
    count: ">= 2"
  - id: no-news-message-reaches-the-owner
    message: { to: owner, contains: ["News"], count: 0 }
